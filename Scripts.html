<script>
'use strict';
(() => {
  const $ = s => document.querySelector(s);

  const statusNames = {draft:'작성 중',submitted:'이전 제출',revision:'이전 수정 요청',published:'공개',archived:'보관'};
  const analysisFields = [['context','① 상황 맥락'],['relationship','화자와 청자의 관계'],['mainExpression','② 주요 대사 및 표현'],['discourseAnalysis','③ 담화 및 화용 분석'],['nonverbalAnalysis','④ 비언어적 표현'],['culturalContext','⑤ 한국 문화적 맥락'],['learningPoint','⑥ 한국어 학습 포인트']];
  let toastTimer, lastViewerFocus, fieldSequence=0;

  /** 사용자 입력은 textContent/속성으로만 렌더링합니다. */
  function el(tag, attrs={}, ...children) {
    const node=document.createElement(tag);
    Object.entries(attrs).forEach(([key,value]) => {
      if (value === undefined || value === null) return;
      if (key === 'class') node.className=value;
      else if (key === 'text') node.textContent=value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2),value);
      else if (key === 'checked' || key === 'disabled' || key === 'hidden') node[key]=value;
      else node.setAttribute(key,String(value));
    });
    children.flat(Infinity).forEach(child => { if(child !== null && child !== undefined) node.append(child instanceof Node ? child : document.createTextNode(String(child))); });
    return node;
  }
  const button=(text,cls,fn,attrs={})=>el('button',{type:'button',class:cls,onclick:fn,...attrs},text);
  const badge=c=>el('span',{class:'status-chip status-'+c.status},statusNames[c.status]||c.status);
  const teamName=id=>(state.gallery.teams.find(t=>t.teamId===id)||state.workspace?.teams.find(t=>t.teamId===id))?.teamName||id;
  const formatDate=s=>s ? new Date(s).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}) : '';

  /** google.script.run을 Promise로 감싸 오류와 처리 지연을 일관되게 안내합니다. */
  function api(name,...args) {

      if(!window.google?.script?.run) { reject(new Error('Apps Script 웹 앱에서 실행하거나 README의 로컬 미리보기를 사용해 주세요.')); return; }
      const timer=setTimeout(()=>{ const e=new Error('응답이 지연되고 있습니다. 저장 요청은 이미 처리되었을 수 있으므로 입력 내용을 복사하고 목록을 새로고침해 확인해 주세요.');e.code='UNCERTAIN';reject(e); },45000);
      google.script.run.withSuccessHandler(result=>{
        clearTimeout(timer);
        if(result?.ok) resolve(result.data);
        else { const e=new Error(result?.error?.message||'서버 응답을 확인할 수 없습니다.');e.code=result?.error?.code;reject(e); }
      }).withFailureHandler(()=>{clearTimeout(timer);const e=new Error('연결을 확인할 수 없습니다. 저장이 처리되었을 수 있으니 입력 내용을 복사하고 목록에서 확인해 주세요.');e.code='UNCERTAIN';reject(e);})[name](...args);
    });
  }
  function toast(message,error=false) { clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').className='toast'+(error?' error':'');$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,error?9000:4000); }
  function showError(error,target) {
    if(target) { target.textContent=error.message; target.hidden=false; target.focus(); }
    else toast(error.message,true);
    if(error.code==='AUTH') { clearSession();toast(error.message,true); }
  }
  function saveSession(s) { state.workspace=null;$('#workspace-page').replaceChildren();$('#admin-page').replaceChildren();state.session=s;try{sessionStorage.setItem('kscene-session',JSON.stringify(s));}catch(e){}$('#logout').hidden=!s; }
  function clearSession() { state.session=null;state.workspace=null;$('#workspace-page').replaceChildren();$('#admin-page').replaceChildren();if($('#viewer').open)closeViewer();try{sessionStorage.removeItem('kscene-session');}catch(e){}$('#logout').hidden=true; }
  function restoreSession() {try{const s=JSON.parse(sessionStorage.getItem('kscene-session'));if(s?.token&&s.expiresAt>Date.now()) saveSession(s);else clearSession();}catch(e){clearSession();} }

  /** 일반 URL·Shorts·단축 주소를 검사한 뒤 안전한 임베드 URL을 만듭니다. */
  function videoInfo(value) {
    let u;try{u=new URL(value);}catch(e){throw new Error('올바른 YouTube URL을 입력해 주세요.');}
    if(u.protocol!=='https:'||u.username||u.password||u.port||!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be','m.youtu.be'].includes(u.hostname)) throw new Error('https://로 시작하는 YouTube 링크만 지원합니다.');
    let id;if(u.hostname.endsWith('youtu.be'))id=u.pathname.slice(1);else if(u.pathname==='/watch')id=u.searchParams.get('v');else if(/^\/(shorts|embed)\//.test(u.pathname))id=u.pathname.split('/')[2];
    if(!/^[\w-]{11}$/.test(id||''))throw new Error('영상 ID를 확인해 주세요. 일반 영상·Shorts·단축 URL을 지원합니다.');
    const t=u.searchParams.get('t')||u.searchParams.get('start')||'0';let start=0;
    if(/^\d+$/.test(t))start=Number(t);else{const m=t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);if(!m||!t)throw new Error('시작 시간은 초 또는 1m30s 형식으로 입력해 주세요.');start=Number(m[1]||0)*3600+Number(m[2]||0)*60+Number(m[3]||0);}
    if(!Number.isSafeInteger(start)||start>604800)throw new Error('영상 시작 시간 범위를 확인해 주세요.');
    return {id,start,url:'https://www.youtube.com/watch?v='+id+(start?'&t='+start:''),embed:'https://www.youtube.com/embed/'+id+'?start='+start+'&rel=0'};
  }
  let youtubePromise;
  const videoPlayers=new Map();
  /** 무료 IFrame API의 오류 이벤트를 받을 수 있으면 플레이어를 원본 안내로 바꿉니다. */
  function youtubeApi() {
    if(window.YT?.Player)return Promise.resolve(window.YT);
    if(youtubePromise)return youtubePromise;
    youtubePromise=new Promise(resolve=>{
      let done=false;
      const finish=value=>{if(!done){done=true;resolve(value);}};
      window.onYouTubeIframeAPIReady=()=>finish(window.YT);
      const script=el('script',{src:'https://www.youtube.com/iframe_api',onerror:()=>finish(null)});
      document.head.append(script);setTimeout(()=>finish(null),8000);
    });
    return youtubePromise;
  }
  function cleanupVideos() {
    videoPlayers.forEach((player,frame)=>{if(!frame.isConnected){try{player.destroy();}catch(e){}videoPlayers.delete(frame);}});
  }
  function videoBlock(url) {
    cleanupVideos();
    try {
      const v=videoInfo(url);
      const frame=el('iframe',{src:v.embed+'&enablejsapi=1&origin='+encodeURIComponent(location.origin),title:'YouTube 영상 플레이어',loading:'lazy',allow:'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share',allowfullscreen:'',referrerpolicy:'strict-origin-when-cross-origin'});

      const block=el('div',{},area,el('p',{class:'video-help'},'영상이 재생되지 않거나 임베드가 제한되어 있나요?',link));
      youtubeApi().then(YT=>{
        if(!YT||!frame.isConnected)return;
        try {
          const player=new YT.Player(frame,{events:{onError:()=>{
            area.replaceChildren(el('div',{class:'video-unavailable',role:'status'},el('p',{},'이 영상은 여기에서 재생할 수 없습니다.'),el('a',{href:v.url,target:'_blank',rel:'noopener noreferrer',class:'secondary'},'YouTube에서 원본 영상 열기 ↗')));
            cleanupVideos();
          }}});
          videoPlayers.set(frame,player);
        } catch(e) { /* API가 제한되어도 iframe과 원본 링크는 그대로 이용할 수 있습니다. */ }
      });
      return block;
    } catch(e) {return el('p',{class:'inline-error'},e.message);}
  }

  /** 전체/팀별 화면 모두 팀 구획을 유지하며 필터와 정렬을 적용합니다. */
  function renderGallery() {

    $('#hero-count').textContent=teams.length+'개 팀 · '+cards.length+'개의 장면';$('#collection-count').textContent=cards.length;
    $('#team-tabs').replaceChildren(...[{teamId:'all',teamName:'전체'},...teams].map(makeTab));
    function makeTab(t,i){return el('button',{type:'button',class:'tab'+(state.team===t.teamId?' active':''),'aria-pressed':state.team===t.teamId,onclick:()=>{state.team=t.teamId;renderGallery();}},t.teamId==='all'?'전체':String(t.sortOrder)+'팀',' ',el('span',{},t.teamId==='all'?cards.length:cards.filter(c=>c.teamId===t.teamId).length));}
    const tags=[...new Set(cards.flatMap(c=>c.tags))].sort((a,b)=>a.localeCompare(b,'ko'));
    if(state.tag&&!tags.includes(state.tag))state.tag='';
    $('#tag-filters').replaceChildren(...['',...tags].map(t=>button(t?'#'+t:'모든 태그','tag-filter'+(state.tag===t?' active':''),()=>{state.tag=t;renderGallery();},{'aria-pressed':state.tag===t})));
    let total=0;
    const groups=teams.filter(t=>state.team==='all'||t.teamId===state.team).map(team=>{
      const all=cards.filter(c=>c.teamId===team.teamId);
      const found=all.filter(c=>(!state.tag||c.tags.includes(state.tag))&&(!state.search||[c.title,...c.tags].some(s=>s.toLocaleLowerCase().includes(state.search)))).sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title,'ko'):(b.publishedAt||'').localeCompare(a.publishedAt||'')||b.cardId.localeCompare(a.cardId));
      total+=found.length;
      return el('section',{class:'team-group','aria-label':team.teamName},el('div',{class:'team-heading'},el('h3',{},el('span',{class:'team-number'},team.sortOrder+'팀'),team.teamName,el('span',{class:'team-count'},'공개 '+all.length+'개'+(found.length!==all.length?' · 검색 '+found.length+'개':''))),button('팀 전체 보기 →','team-all',()=>{state.team=team.teamId;state.tag='';state.search='';$('#search').value='';renderGallery();})),found.length?el('div',{class:'card-grid'},found.map(c=>galleryCard(c,team))):el('div',{class:'empty-group'},all.length?'조건에 맞는 장면이 없어요. 검색어나 태그를 바꿔 보세요.':'아직 공개된 장면이 없어요. 이 팀의 첫 장면을 기다려 주세요.'));
    });
    $('#team-groups').replaceChildren(...groups);
    const message=$('#gallery-status');message.replaceChildren();message.hidden=!!teams.length;
    if(!teams.length)message.textContent='아직 등록된 팀이 없어요. 교수자에게 문의해 주세요.';
    $('#collection-count').textContent=total;
  }
  function galleryCard(c,team) {
    let id='';try{id=videoInfo(c.videoUrl).id;}catch(e){}
    const fallback=el('div',{class:'thumbnail-fallback','aria-hidden':'true'},'K : SCENE');
    // 네트워크에서 한 도메인이 제한된 경우 다른 공식 썸네일 주소를 순서대로 시도합니다.
    const sources=id?['https://i.ytimg.com/vi/'+id+'/hqdefault.jpg','https://img.youtube.com/vi/'+id+'/hqdefault.jpg','https://i.ytimg.com/vi/'+id+'/mqdefault.jpg']:[];
    let sourceIndex=0;
    const image=el('img',{alt:c.contentTitle+' 영상 썸네일',loading:'lazy',referrerpolicy:'no-referrer',onload:()=>{fallback.hidden=true;},onerror:()=>{
      if(++sourceIndex<sources.length)image.src=sources[sourceIndex];else{image.hidden=true;fallback.hidden=false;}
    }});
    if(sources.length)image.src=sources[0];else image.hidden=true;
    const thumb=el('div',{class:'thumbnail'},fallback,image,el('span',{},c.contentTitle),el('div',{class:'play-mark','aria-hidden':'true'},'▶'));
    return el('article',{class:'scene-card'},thumb,el('div',{class:'card-body'},el('div',{class:'card-topline'},el('span',{},team.teamName),el('span',{},formatDate(c.publishedAt))),el('h4',{title:c.title},c.title),el('p',{class:'card-description'},c.description),el('div',{class:'chips'},c.tags.map(t=>el('span',{class:'chip'},'#'+t))),el('div',{class:'card-footer'},el('button',{type:'button',class:'view-button',onclick:()=>openCard(c),'aria-label':c.title+' 카드 살펴보기'},'카드 살펴보기',el('span',{'aria-hidden':'true'},'↗')))));
  }
  async function loadGallery(silent=false) {
    if(state.loadingGallery)return;
    state.loadingGallery=true;
    try{state.gallery=await api('getGallery');renderGallery();}
    catch(e){if(!silent){$('#gallery-status').hidden=false;$('#gallery-status').replaceChildren(el('p',{},e.message),button('다시 불러오기','secondary',()=>loadGallery()));}else toast('갤러리를 갱신하지 못했습니다. 잠시 후 다시 확인해 주세요.',true);}
    finally{state.loadingGallery=false;}
  }

  /** 모달은 dialog 기본 포커스 트랩과 Escape 닫기를 사용합니다. */
  function openViewer(label) {lastViewerFocus=document.activeElement;$('#viewer-label').textContent=label;$('#viewer-content').replaceChildren();if(!$('#viewer').open)$('#viewer').showModal();$('#viewer').scrollTop=0;}
  function closeViewer() {$('#viewer').close();$('#viewer-content').replaceChildren();cleanupVideos();lastViewerFocus?.focus();}
  function flip(inner,back) {
    const front=inner.querySelector('.card-front'),rear=inner.querySelector('.card-back');
    front.setAttribute('aria-hidden',String(back));front.inert=back;rear.setAttribute('aria-hidden',String(!back));rear.inert=!back;inner.classList.toggle('flipped',back);$('#viewer').scrollTop=0;
    setTimeout(()=>{(back?rear:front).querySelector('h2')?.focus();},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:510);
  }
  function analysisCard(c,result) {
    const node=el('div',{},el('p',{class:'scene-content'},c.contentTitle),el('h2',{class:'scene-title',tabindex:'-1'},c.title));
    if(result)node.append(el('div',{class:'result-banner'},el('b',{},result.correct?'좋아요! 상황과 관계를 고려해 적절한 표현을 선택했어요.':'다른 표현도 가능하지만, 이 상황에서는 상대와의 관계를 고려할 필요가 있어요.'),el('p',{},'내가 고른 답: '+result.chosenChoiceId+' · 정답: '+c.correctChoiceId)));
    analysisFields.forEach(([key,title])=>node.append(el('section',{class:'analysis-section'},el('h3',{},title),el('p',{},c[key]||'아직 작성하지 않았습니다.'))));
    const answer=c.quizOptions.find(o=>o.id===c.correctChoiceId);
    node.append(el('section',{class:'analysis-section'},el('h3',{},'⑦ 퀴즈 정답 및 해설'),el('p',{},'정답: '+(answer?answer.id+'. '+answer.text:'미선택')),el('p',{},c.quizExplanation||'해설을 작성해 주세요.')));
    return node;
  }
  function openCard(c,preview=false) {
    openViewer(preview?'WORKSPACE PREVIEW · 저장 전 미리보기':'SCENE EXPLORER · '+teamName(c.teamId));
    const front=el('section',{class:'card-face card-front','aria-hidden':'false'}),back=el('section',{class:'card-face card-back','aria-hidden':'true'});back.inert=true;
    const inner=el('div',{class:'flip-inner'},front,back);
    if(preview)front.append(el('p',{class:'preview-note'},'내 팀의 작성 내용 미리보기입니다. 저장·제출되지 않으며 정답은 입력한 값을 기준으로 확인합니다.'));
    front.append(videoBlock(c.videoUrl),el('p',{class:'scene-content'},c.contentTitle||'콘텐츠명 미입력'),el('h2',{class:'scene-title',tabindex:'-1'},c.title||'제목 없는 카드'),el('p',{class:'scene-description'},c.description||'장면과 상황적 배경을 입력해 주세요.'));
    const quiz=el('form',{class:'quiz-box'}),error=el('p',{class:'inline-error',role:'alert',tabindex:'-1',hidden:true});
    const field=el('fieldset',{},el('legend',{},'SCENE QUIZ · 상황에 어울리는 표현'),el('h3',{},c.quizQuestion||'퀴즈 질문 미입력'));
    c.quizOptions.forEach(o=>field.append(el('label',{class:'choice'},el('input',{type:'radio',name:'choice',value:o.id,required:true}),el('span',{},o.id+'. '+(o.text||'선택지 미입력')))));
    const submit=el('button',{type:'submit',class:'primary'},'정답 확인 및 카드 뒤집기 ↻');quiz.append(field,error,submit);front.append(quiz);
    quiz.addEventListener('submit',async e=>{
      e.preventDefault();const choice=new FormData(quiz).get('choice');if(!choice)return;submit.disabled=true;error.hidden=true;
      try{
        const result=preview?{correct:choice===c.correctChoiceId,chosenChoiceId:choice,card:c}:await api('submitQuiz',c.cardId,choice,Number(c.version));
        if(!inner.isConnected)return;
        back.replaceChildren(analysisCard(result.card,result),el('div',{class:'back-actions'},button('← 장면 다시 보기','secondary',()=>flip(inner,false)),button('닫기','text-button',closeViewer)));
        flip(inner,true);
      }catch(err){if(inner.isConnected)showError(err,error);}finally{submit.disabled=false;}
    });
    $('#viewer-content').append(el('div',{class:'flip-stage'},inner));
  }

  /** 메뉴 변경 전 저장하지 않은 입력을 보호합니다. */
  async function navigate(page) {
    if(state.editorDirty&&!confirm('저장하지 않은 내용이 있습니다. 이 화면을 나갈까요?'))return;
    state.editorDirty=false;state.page=page==='teams'?'gallery':page;
    document.querySelectorAll('main>section').forEach(s=>s.hidden=true);
    document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));
    if(page==='gallery'||page==='teams') {$('#gallery-page').hidden=false;if(page==='teams')$('#collection-title').scrollIntoView({behavior:'smooth'});await loadGallery(true);return;}
    if(!state.session||state.session.expiresAt<=Date.now()||(page==='admin'&&state.session.role!=='admin')||(page==='workspace'&&state.session.role!=='team')){renderLogin(page);return;}
    await loadWorkspace(page);
  }
  function errorBox(){return el('p',{class:'inline-error',role:'alert',tabindex:'-1',hidden:true});}
  function field(label,name,value='',type='text',required=false) {
    const input=el(type==='textarea'?'textarea':'input',{name,id:'field-'+name+'-'+(++fieldSequence),...(type!=='textarea'?{type}:{}),required:required?'':null,maxlength:type==='textarea'?6000:160});
    input.value=value;
    return el('label',{class:'form-field'},label+(required?' *':''),input);
  }
  function selectField(label,name,items,value) {
    const select=el('select',{name,id:'field-'+name+'-'+(++fieldSequence)},items.map(([v,l])=>el('option',{value:v},l)));select.value=value;
    return el('div',{class:'form-field'},el('label',{for:select.id},label),select);
  }
  function renderLogin(page) {

    const admin=page==='admin',form=el('form',{class:'login-panel'}),error=errorBox();
    form.append(el('p',{class:'eyebrow'},admin?'TEACHER SPACE':'TEAM WORKSPACE'),el('h1',{},admin?'교수자 관리':'우리 팀의 장면을 기록해요'),el('p',{class:'help-text'},admin?'교수자 전용 관리 코드를 입력해 주세요.':'팀을 선택하고 교수자가 발급한 편집 코드를 입력해 주세요.'));
    if(!admin)form.append(selectField('우리 팀','teamId',state.gallery.teams.map(t=>[t.teamId,t.sortOrder+'팀 · '+t.teamName]),state.gallery.teams[0]?.teamId||''));
    const codeField=field(admin?'관리자 코드':'팀 편집 코드','code','','password',true);codeField.style.marginTop='22px';codeField.querySelector('input').maxLength=128;codeField.querySelector('input').autocomplete='current-password';form.append(codeField,error);
    const submit=el('button',{type:'submit',class:'primary'},'입장하기 →');form.append(submit,el('p',{class:'session-note'},'로그인은 최대 6시간 유지됩니다. 공동 기기에서는 사용 후 로그아웃해 주세요.'));
    panel.replaceChildren(form);
